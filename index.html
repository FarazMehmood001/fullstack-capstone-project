<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .logo { font-size: 24px; font-weight: 700; color: #4f46e5; }
    nav a { color: #4b5563; text-decoration: none; margin-left: 24px; }
    .hero {
      max-width: 1000px;
      margin: 0 auto;
      min-height: calc(100vh - 85px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .hero-card {
      background: rgba(255,255,255,.9);
      padding: 60px 45px;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(79,70,229,.15);
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 { font-size: clamp(42px, 7vw, 72px); margin-bottom: 18px; color: #111827; }
    p { max-width: 680px; margin: 0 auto 30px; font-size: 20px; line-height: 1.6; color: #6b7280; }
    .btn {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }
    .btn:hover { background: #3730a3; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Gift Finder</div>
    <div><a href="#about">About</a><a href="#gifts">Gifts</a></div>
  </nav>

  <main class="hero" id="about">
    <section class="hero-card">
      <div class="badge">Personalized Gift Shopping</div>
      <h1>Find the Perfect Gift</h1>
      <p>Discover thoughtful gifts for every occasion. Search, explore, and find something special for the people you care about.</p>
      <a class="btn" href="#gifts" id="get-started">Get Started</a>
    </section>
  </main>
</body>
</html>
